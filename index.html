<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Calendar</title><style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}body{margin:0;background:light-dark(#f3f6fa,#10151e);color:light-dark(#17243a,#e8edf5)}main{max-width:780px;margin:auto;padding:28px 18px}section,article{background:light-dark(white,#1b2534);border:1px solid light-dark(#dce4ef,#344153);border-radius:16px;padding:20px;margin:12px 0}h1{font-size:clamp(30px,6vw,48px);margin:12px 0}a,button{display:inline-block;padding:12px 16px;border-radius:10px;background:#245bc4;color:white;text-decoration:none;border:0;font:inherit;cursor:pointer;margin:4px 4px 4px 0}input,select{font:inherit;padding:10px;max-width:100%;border-radius:8px}small{opacity:.8}article{display:flex;gap:16px;align-items:center;padding:14px}article time{min-width:110px;font-size:14px}article strong{display:block} .tag{font-size:12px;color:light-dark(#245bc4,#a8c6ff)} </style><main><small>2026年度 / 非公式</small><h1>School Calendar</h1><p>長野工業高校・1学年 年間行事予定</p><section><h2>カレンダーを購読</h2><a id="apple">Appleカレンダーに追加</a><a id="google">Googleカレンダーに追加</a><button id="copy">購読URLをコピー</button><a href="calendar.ics" download>ICS保存</a><p><small>Outlookは購読URLを「Webから購読」に入力してください。ICSの単発インポートは自動更新されません。</small></p><p id="status" role="status"></p></section><h2>行事一覧</h2><input id="q" placeholder="行事を検索" aria-label="行事を検索"><select id="filter" aria-label="分類"><option>すべて</option><option>考査</option><option>休暇・休校</option><option>行事</option></select><label><input type="checkbox" id="past">終了済みも表示</label><div id="list"></div><footer><small>出典：令和8年度年間行事予定表（3月27日訂正版）。春休みは推定。学校からの最新連絡を優先してください。</small></footer></main><script>
const [apple,google,copy,q,filter,past,list]=['apple','google','copy','q','filter','past','list'].map(id=>document.getElementById(id));const url=new URL('calendar.ics',location.href).href;apple.href=url.replace(/^https?:/,'webcal:');google.href='https://calendar.google.com/calendar/u/0/r?cid='+encodeURIComponent(url.replace(/^https?:/,'webcal:'));copy.onclick=async()=>{try{await navigator.clipboard.writeText(url);statusEl.textContent='コピーしました'}catch{prompt('購読URL',url)}};const statusEl=document.getElementById('status');const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(new Date());fetch('events.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(es=>{function render(){list.replaceChildren();for(const e of es.filter(e=>(past.checked||e.end>=today)&&(filter.value==='すべて'||filter.value===e.category)&&e.title.includes(q.value))){let a=document.createElement('article'),d=document.createElement('time'),b=document.createElement('div'),t=document.createElement('strong'),c=document.createElement('span');d.textContent=e.start+(e.end!==e.start?' ～ '+e.end:'');t.textContent=e.title;c.textContent=e.category;c.className='tag';b.append(t,c);a.append(d,b);list.append(a)}if(!list.children.length)list.textContent='該当する予定はありません'}for(const x of [q,filter,past])x.addEventListener('input',render);render()}).catch(()=>list.textContent='予定を読み込めません。GitHub Pages上で開いてください。');</script></html>
